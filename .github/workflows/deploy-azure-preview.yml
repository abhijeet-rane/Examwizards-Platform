name: Deploy Azure Preview

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "chatbot/**"
      - ".github/workflows/deploy-azure-preview.yml"
  workflow_dispatch:

concurrency:
  group: deploy-azure-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-backend:
    name: Verify Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify -DskipTests

  verify-frontend:
    name: Verify Frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build frontend
        working-directory: frontend
        env:
          VITE_CHATBOT_API_URL: http://localhost:5000
        run: |
          npm ci
          npm run build

  verify-chatbot:
    name: Verify Chatbot (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chatbot/package-lock.json
      - name: Install and verify chatbot
        working-directory: chatbot
        env:
          GENAI_API_KEY: ci-placeholder-not-used-at-runtime
        run: |
          npm ci
          node --check server.js

  verify-terraform-azure:
    name: Verify Terraform (Azure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
      - name: Format check
        run: terraform fmt -check -recursive infra/azure/terraform
      - name: Init and validate
        working-directory: infra/azure/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

  deploy-backend:
    name: Deploy Backend (Azure Web App)
    runs-on: ubuntu-latest
    needs:
      - verify-backend
      - verify-frontend
      - verify-chatbot
      - verify-terraform-azure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend jar
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests

      - name: Prepare deployment package
        run: |
          cp backend/target/*.jar app.jar
          zip -j backend-deploy.zip app.jar

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_API_PUBLISH_PROFILE }}
          package: backend-deploy.zip

  deploy-chatbot:
    name: Deploy Chatbot (Azure Web App)
    runs-on: ubuntu-latest
    needs:
      - verify-backend
      - verify-frontend
      - verify-chatbot
      - verify-terraform-azure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chatbot/package-lock.json

      - name: Validate chatbot source
        working-directory: chatbot
        run: |
          npm ci
          node --check server.js

      - name: Prepare chatbot deployment package
        run: |
          zip -j chatbot-deploy.zip chatbot/server.js chatbot/package.json chatbot/package-lock.json

      - name: Deploy chatbot to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_CHATBOT_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_CHATBOT_PUBLISH_PROFILE }}
          package: chatbot-deploy.zip
