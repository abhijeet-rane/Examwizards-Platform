name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B verify -DskipTests

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  terraform-aws:
    name: Terraform fmt and validate (AWS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Format check
        run: terraform fmt -check -recursive infra/aws/terraform

      - name: Init and validate
        working-directory: infra/aws/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

  terraform-azure:
    name: Terraform fmt and validate (Azure preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Format check
        run: terraform fmt -check -recursive infra/azure/terraform

      - name: Init and validate
        working-directory: infra/azure/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
